n);border-color:var(--gnb);color:var(--onc)}button[data-cf=in_progress][aria-pressed=true]{background:var(--yw);border-color:var(--ywb);color:var(--onc)}button[data-cf=tbw][aria-pressed=true]{background:var(--bl);border-color:var(--blb);color:var(--onc)}.row.st-gr{background:var(--gn);border-color:var(--gnb);color:var(--onc)}.row.st-gr .t{color:var(--onc)}.row.st-gr .m{color:var(--onm)}button[data-cf=owned][data-ck=funko][aria-pressed=true]{background:var(--gn);border-color:var(--gnb);color:var(--onc)}.vs{margin-top:8px;border-top:1px dashed rgba(127,127,127,.5);padding-top:6px}.vs .vr{display:flex;align-items:center;gap:10px;margin-top:8px}.vs .vr .t{font-weight:normal;text-decoration:underline dotted}.vs .vl{font-size:12px;color:var(--mut)}dialog code{font-size:12px;word-break:break-word}

<script>
// ====== CONFIG: paste your values from Supabase (Project Settings -> API) ======
const SUPABASE_URL = "https://xagqvrmlwqbwlmlljomk.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_nu06QaBn3cq3PVMvxAp8hw_aBQMnC_N";   // anon/publishable key only. NEVER the service_role key.
// ===============================================================================

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const msg=t=>{$("msg").textContent=t||""};
let sb,uid=null,authors=[],genres=[],series=[],books=[],covers=[];
const A=id=>authors.find(x=>x.author_id==id)||{name:"?",sort_name:"?"};
const G=id=>genres.find(x=>x.genre_id==id)||{name:"?"};
const S=id=>series.find(x=>x.series_id==id)||{name:"?"};

/* ---------- auth ---------- */
function showLogin(err){$("app").hidden=true;$("login").hidden=false;if(err){$("lerr").textContent=err}}
async function onSession(s){
  if(!s){uid=null;showLogin();return}
  if(s.user.id===uid)return;
  uid=s.user.id;$("login").hidden=true;$("app").hidden=false;$("who").textContent=s.user.email||"";
  await load();
  loadCols();history.replaceState({v:"land"},"");showLand(false);
}
// Diagnostic line (safe to show: it reveals only the project address and the start of the public key)
try{const h=new URL(SUPABASE_URL);$("diag").textContent=`Check: address=${h.origin}${h.pathname!=="/"?h.pathname:""} · key starts "${SUPABASE_ANON_KEY.slice(0,14)}" (${SUPABASE_ANON_KEY.length} characters) · app v90`}
catch(e){$("diag").textContent=`Check: the Supabase address is not a valid web address (${JSON.stringify(SUPABASE_URL)}) · app v4`}
if(SUPABASE_URL.startsWith("YOUR_")){showLogin("Set SUPABASE_URL and SUPABASE_ANON_KEY at the top of index.html.");$("gin").hidden=true}
else if(!window.supabase){showLogin("Could not load the Supabase library. Check your connection.");$("gin").hidden=true}
else{
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  // do not await Supabase calls inside this callback; defer them
  sb.auth.onAuthStateChange((ev,s)=>{if(["INITIAL_SESSION","SIGNED_IN","SIGNED_OUT"].includes(ev))setTimeout(()=>onSession(s),0)});
}
$("gin").onclick=async()=>{
  // Build the Google sign-in URL ourselves so we can make sure the apikey is attached to it.
  $("lerr").textContent="";
  try{
    const {data,error}=await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname,skipBrowserRedirect:true}});
    if(error||!data?.url){$("lerr").textContent="Could not start sign-in: "+(error?error.message:"no sign-in address returned");return}
    const u=new URL(data.url);
    if(!u.searchParams.has("apikey"))u.searchParams.set("apikey",SUPABASE_ANON_KEY);
    $("lerr").textContent="Going to "+u.origin+u.pathname+" …";
    location.assign(u.toString());
  }catch(e){$("lerr").textContent="Sign-in failed: "+(e&&e.message?e.message:String(e))}
};
$("out").onclick=()=>sb.auth.signOut();

/* ---------- data ---------- */
// Supabase returns at most 1000 rows per request, so read each table in pages of 1000 until it runs out.
async function fetchAll(t,key){
  const out=[];
  for(let from=0;;from+=1000){
    const {data,error}=await sb.from(t).select("*").order(key).range(from,from+999);
    if(error)return{error};
    out.push(...data);
    if(data.length<1000)break;
  }
  return{data:out};
}
async function load(){
  msg("Loading…");
  const keys={authors:"author_id",genres:"genre_id",series:"series_id",books:"book_id",book_covers:"cover_id"};
  const r=await Promise.all(Object.keys(keys).map(t=>fetchAll(t,keys[t])));
  const e=r.find(x=>x.error);if(e){msg("Load failed: "+e.error.message);return}
  [authors,genres,series,books,covers]=r.map(x=>x.data);msg("");fill();render();loadBingo();loadBN();
  // owned books cannot be on the Wishlist or Safe for MJG lists: tidy up any that already are
  books.filter(b=>b.owned&&(b.wishlist||b.safe_mjg)).forEach(b=>{upd(b,{wishlist:false,safe_mjg:false}).then(render)});
}
async function upd(b,patch){
  const old={};for(const k in patch)old[k]=b[k];Object.assign(b,patch);
  const {error}=await sb.from("books").update(patch).eq("book_id",b.book_id);
  if(error){Object.assign(b,old);msg("Save failed: "+error.message);return false}
  msg("");return true;
}
async function ent(tbl,list,name,mk){
  let x=find(list,name);
  if(!x){const {data,error}=await sb.from(tbl).insert(mk(name.trim())).select().single();if(error)throw error;list.push(data);x=data}
  return x;
}
const HAS_MJG=()=>!books.length||"read_mjg" in books[0];
async function put(d,old){
  const au=await ent("authors",authors,d.author,n=>({name:n,sort_name:sortName(n)}));

    series_order:num(d.reading_order),reading_order:num(d.reading_order),publication_order:num(d.publication_order),
    publication_year:nz(d.publication_year)?Number(nz(d.publication_year)):null,description:nz(d.description),
    owned:d.owned,read:d.read,...(HAS_MJG()||d.read_mjg?{read_mjg:!!d.read_mjg}:{}),...(d.wishlist!==undefined?{wishlist:!!d.wishlist}:{}),...(d.tbr!==undefined?{tbr:!!d.tbr}:{}),notes:"notes" in d?nz(d.notes):old?old.notes:null};

  const sl=slug([ge.name,au.name.split(" ").pop(),sn||"",f.title].filter(Boolean).join(" "));

}
async function prune(){

        ad=authors.filter(a=>!books.some(b=>b.author_id==a.author_id)),
        gd=genres.filter(g=>!books.some(b=>b.genre_id==g.genre_id));

    if(dead.length){const {error}=await sb.from(t).delete().in(k,dead.map(x=>x[k]));if(error){msg("Cleanup failed: "+error.message);return}}

/* ---------- CSV import / export ---------- */
function parseCSV(t){const rows=[];let r=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){r.push(f);f=""}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);rows.push(r);r=[];f=""}else f+=c}
  if(f||r.length){r.push(f);rows.push(r)}return rows.filter(r=>r.some(x=>x.trim()))}
const UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
function toForm(b){return{title:b.title,subtitle:b.subtitle,author:A(b.author_id).name,genre:G(b.genre_id).name,series:b.series_id?S(b.series_id).name:"",
  reading_order:b.reading_order,publication_order:b.publication_order,publication_year:b.publication_year,
  description:b.description,notes:b.notes,owned:b.owned,read:b.read,read_mjg:!!b.read_mjg}}
function norm(d){const n=v=>{v=num(v);return v==null?null:v};
  return JSON.stringify([String(d.title).trim(),nz(d.subtitle),String(d.author).trim().toLowerCase(),String(d.genre).trim().toLowerCase(),(nz(d.series)||"").toLowerCase(),
    n(d.reading_order),n(d.publication_order),nz(d.publication_year),nz(d.description),nz(d.notes),!!d.owned,!!d.read,!!d.read_mjg])}
async function doImport(t,out,prune_missing){
  const rows=parseCSV(t.replace(/^﻿/,""));if(rows.length<2)return"No data rows found.";
  const h=rows[0].map(x=>x.trim().toLowerCase()),miss=["title","author","genre"].filter(c=>!h.includes(c));
  if(miss.length)return"Missing required column(s): "+miss.join(", ");
  const low=x=>String(x||"").trim().toLowerCase(),fileKeys=new Set();
  if(h.includes("series")){const ti=h.indexOf("title"),ai=h.indexOf("author"),si=h.indexOf("series");for(let i=1;i<rows.length;i++)fileKeys.add([low(rows[i][ti]),low(rows[i][ai]),low(rows[i][si])].join("|"))}
  let added=0,updated=0,same=0,moved=0;const err=[],again=[],touched=new Set();
  for(let i=1;i<rows.length;i++){
    const r=rows[i],raw={};h.forEach((c,j)=>{if(c)raw[c]=r[j]});
    // legacy column name: accept publication_date but keep only the year
    if("publication_date" in raw){if(!("publication_year" in raw)){const m=String(raw.publication_date??"").match(/\b(\d{4})\b/);raw.publication_year=m?m[1]:(nz(raw.publication_date)?raw.publication_date:"")}delete raw.publication_date}
    // legacy columns: series_order is now the same as reading_order; isbn_13 is no longer used
    if("series_order" in raw){if(!("reading_order" in raw))raw.reading_order=raw.series_order;delete raw.series_order}
    delete raw.isbn_13;
    raw.owned=h.includes("owned")?bl(raw.owned):undefined;if("read_mfg" in raw&&!("read" in raw))raw.read=raw.read_mfg;delete raw.read_mfg;raw.read=(h.includes("read")||h.includes("read_mfg"))?bl(raw.read):undefined;raw.read_mjg=h.includes("read_mjg")?bl(raw.read_mjg):undefined;
    // find the existing book: by book_id first, then by title + author
    let ex=null;const bid=nz(raw.book_id);
    if(bid&&UUID.test(bid))ex=books.find(b=>b.book_id==bid.toLowerCase())||null;
    if(!ex&&nz(raw.title)&&nz(raw.author)){
      // a book is "the same" only if title, author AND series all match, so "Volume 1" of two series stays two books
      const T=raw.title.trim().toLowerCase(),Au=raw.author.trim().toLowerCase();
      let c=books.filter(b=>b.title.toLowerCase()==T&&A(b.author_id).name.toLowerCase()==Au);
      if(h.includes("series")){const sn=(nz(raw.series)||"").toLowerCase(),all=c;c=c.filter(b=>(b.series_id?S(b.series_id).name.toLowerCase():"")==sn);
        // no exact match: the series was probably renamed. Reuse the same title + author if it is unambiguous and its old series is not used by another row of this file
        if(!c.length){
          let f=all.filter(b=>!touched.has(b.book_id)&&!fileKeys.has([T,Au,b.series_id?S(b.series_id).name.toLowerCase():""].join("|")));
          if(f.length>1){const ro=num(raw.reading_order);if(ro!=null&&!isNaN(ro)){const g=f.filter(b=>b.reading_order==ro);if(g.length)f=g}}
          if(f.length==1){c=f;moved++}
        }}
      else if(c.length>1){err.push(`Row ${i+1}: "${raw.title.trim()}" exists in more than one series. Add a series column (or book_id) so I know which one.`);continue}
      ex=c[0]||null;
    }
    // columns missing from the CSV keep their current value; columns present (even blank) overwrite
    const d=ex?toForm(ex):{owned:false,read:false,read_mjg:false};
    for(const k in raw){if(k=="book_id"||raw[k]===undefined)continue;d[k]=raw[k]}
    if(!ex){if(d.owned===undefined)d.owned=false;if(d.read===undefined)d.read=false;if(d.read_mjg===undefined)d.read_mjg=false}
    const e=val(d);if(e.length){err.push(`Row ${i+1}: ${e.join("; ")}`);continue}
    // a row that points at a book this same file already handled is a repeat: report it instead of silently merging it
    if(ex&&touched.has(ex.book_id)){again.push(`Row ${i+1}: "${String(d.title).trim()}"${nz(d.series)?` (${nz(d.series)})`:""} repeats an earlier row`);continue}
    if(ex&&norm(d)==norm(toForm(ex))){same++;touched.add(ex.book_id);continue}
    out.textContent=`Importing ${i} of ${rows.length-1}…`;
    try{const nb=await put(d,ex||undefined);touched.add(nb.book_id);ex?updated++:added++}catch(x){err.push(`Row ${i+1}: ${x.message}`)}
  }
  let removed=0,merged=0;
  if(prune_missing&&!err.length){
    const stale=books.filter(b=>!touched.has(b.book_id));
    if(stale.length&&confirm(`${stale.length} book${stale.length==1?"":"s"} in your list ${stale.length==1?"is":"are"} not in this file. Remove ${stale.length==1?"it":"them"}? (Covers, notes and wishlist/TBR marks are copied to the matching book first.)`)){
      for(const o of stale){
        out.textContent=`Cleaning up… ${removed+1} of ${stale.length}`;
        try{
          const n=books.find(b=>b.book_id!=o.book_id&&touched.has(b.book_id)&&b.title.toLowerCase()==o.title.toLowerCase()&&b.author_id==o.author_id);
          if(n){
            const patch={};
            if(o.cover_id&&!n.cover_id){const r=await sb.from("book_covers").update({book_id:n.book_id}).eq("cover_id",o.cover_id);if(!r.error){patch.cover_id=o.cover_id;const cv=covers.find(x=>x.cover_id==o.cover_id);if(cv)cv.book_id=n.book_id;o.cover_id=null}}
            if(o.notes&&!n.notes)patch.notes=o.notes;
            if(o.wishlist&&!n.wishlist)patch.wishlist=true;
            if(o.tbr&&!n.tbr)patch.tbr=true;
            if(Object.keys(patch).length){await upd(n,patch);merged++}
          }
          const r=await sb.from("books").delete().eq("book_id",o.book_id);if(r.error)throw r.error;
          books=books.filter(b=>b.book_id!=o.book_id);covers=covers.filter(x=>x.book_id!=o.book_id);removed++;
        }catch(x){err.push(`Could not remove "${o.title}": ${x.message}`)}
      }
    }
  }
  await prune();
  const list=(arr,label)=>arr.length?`<p class="m"><strong>${label}</strong></p><ul>`+arr.slice(0,10).map(x=>`<li>${esc(x)}</li>`).join("")+(arr.length>10?`<li>…and ${arr.length-10} more</li>`:"")+"</ul>":"";
  return`${rows.length-1} rows read: <strong>${added} added</strong>, ${updated} updated, ${same} unchanged, ${again.length} repeated within the file, ${err.length} invalid.`+(moved?` ${moved} of the updated books had a changed series name and were matched by title + author.`:"")+(prune_missing?` ${removed} old book${removed==1?"":"s"} removed${merged?` (${merged} had a cover, note or list mark copied over)`:""}.`:"")+list(again,"Repeated rows (skipped, the first one was used):")+list(err,"Invalid rows (skipped):");
}
function imp(){
  const d=$("im");d.innerHTML=`<h2 style="margin-top:0">Import CSV</h2><p class="m">Required columns: title, author, genre. Optional: subtitle, series, reading_order (also used as the series order), publication_order, publication_year, owned, read, notes, description, book_id. A book that already exists (matched by book_id, or by title + author + series) is <strong>updated</strong> with the values in the file; a column that is missing from the file leaves that field as it is, while a blank cell clears it. New books are added. Nothing is ever deleted by an import. Dates: give the year only (for example 1954). A column named publication_date is also accepted, and only its year is used. Older files with series_order or isbn_13 columns still import: series_order is used as the reading order if there is no reading_order column, and isbn_13 is ignored.</p><p><label class="m"><input type="checkbox" id="imdel"> Also remove books that are not in this file (only tick this if the file is your complete list)</label></p><input type="file" id="fi" accept=".csv,text/csv"><div id="ir" class="m" role="status"></div><p><button type="button" id="ic">Close</button></p>`;
  d.showModal();$("ic").onclick=()=>d.close();
  $("fi").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=async()=>{const out=$("ir");out.innerHTML=await doImport(String(r.result),out,$("imdel").checked);fill();render()};r.readAsText(f)};
}
function exp(){
  const q=v=>{v=v==null?"":String(v);return/[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const H=["book_id","title","subtitle","author","genre","series","reading_order","publication_order","publication_year","owned","read_mfg","read_mjg","wishlist","tbr","safe_for_mjg","notes","description"];
  const rows=books.map(b=>[b.book_id,b.title,b.subtitle,A(b.author_id).name,G(b.genre_id).name,b.series_id?S(b.series_id).name:"",b.reading_order,b.publication_order,b.publication_year,b.owned,b.read,!!b.read_mjg,!!b.wishlist,!!b.tbr,!!b.safe_mjg,b.notes,b.description].map(q).join(","));
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+[H.join(","),...rows].join("\r\n")],{type:"text/csv"}));

}

/* ---------- cover picker (Open Library) ---------- */
const OL="https://openlibrary.org",olImg=(id,s)=>`https://covers.openlibrary.org/b/id/${id}-${s}.jpg`;
async function olJSON(u){const r=await fetch(u);if(!r.ok)throw new Error("Open Library answered "+r.status);return r.json()}
async function setCover(b,c){
  const {data,error}=await sb.from("book_covers").insert({book_id:b.book_id,image_url:c.image_url,thumbnail_url:c.thumbnail_url,alt_text:c.alt_text,is_primary:true,source:c.source}).select().single();
  if(error)throw error;

  if(r.error){await sb.from("book_covers").delete().eq("cover_id",data.cover_id);throw r.error}
  const hadOld=covers.some(x=>x.book_id==b.book_id);
  b.cover_id=data.cover_id;covers=covers.filter(x=>x.book_id!=b.book_id);covers.push(data);
  if(hadOld)await sb.from("book_covers").delete().eq("book_id",b.book_id).neq("cover_id",data.cover_id);
}
async function clearCover(b){
  const r=await sb.from("books").update({cover_id:null}).eq("book_id",b.book_id);if(r.error)throw r.error;
  b.cover_id=null;
  const d=await sb.from("book_covers").delete().eq("book_id",b.book_id);if(d.error)throw d.error;
  covers=covers.filter(x=>x.book_id!=b.book_id);
}
function coverPicker(b){
  const d=$("cvd"),st={works:[],key:null,offset:0,seen:new Set(),done:true,tok:0,gbIndex:0};
  d.innerHTML=`<h2 style="margin-top:0">Choose cover</h2><p class="m">${esc(b.title)}</p>
  <div class="fm"><div class="g2"><label>Title<input id="cs_t" value="${esc(b.title)}"></label><label>Author<input id="cs_a" value="${esc(A(b.author_id).name)}"></label></div></div>
  <div class="fm"><label>Source<select id="cs_src" style="width:100%"><option value="ol">Open Library</option><option value="gb">Google Books</option></select></label></div>
  <div class="tg"><button type="button" id="cs_go">Search</button></div>
  <div class="fm" id="cs_wrap"><label>Matching book<select id="cs_w" style="width:100%"></select></label></div>
  <div class="fm" id="cs_nlw"><label><input type="checkbox" id="cs_nl"> Also show editions with no language listed</label></div>

  <div class="tg"><button type="button" id="cs_use">Use this address</button><button type="button" id="cs_rm">Remove cover</button><button type="button" id="cs_x">Close</button></div>`;
  const say=t=>{$("cs_msg").textContent=t||""};

  const src=()=>$("cs_src").value;

    try{
      const q=new URLSearchParams({title:t,limit:"8",language:"eng",fields:"key,title,author_name,first_publish_year,edition_count,cover_i"});if(a)q.set("author",a);

      await loadWork();
    }catch(e){if(tok===st.tok)say("Could not reach Open Library ("+e.message+"). You can still paste an image address below.")}

  async function loadWork(){

  async function olMore(){

        const es=j.entries||[];st.offset+=es.length;

  async function gbSearch(){

  async function gbMore(){

  const key=(o,n)=>(o.series||"").trim().toLowerCase()+"|"+n.trim().toLowerCase();
  const base=new Map();
  items.forEach(o=>{if(!VB.test(o.name)&&!base.has(key(o,o.name)))base.set(key(o,o.name),{o,v:[]})});
  const out=[];
  items.forEach(o=>{
    const m=VB.exec(o.name);
    if(m){const b=base.get(key(o,m[1]));if(b){b.v.push(o);return}out.push({o,v:[]})}
    else{const b=base.get(key(o,o.name));out.push(b&&b.o===o?b:{o,v:[]})}
  });
  return out;
}

function ccoerce(f,v){
  v=String(v??"").trim();if(v==="")return{v:null};
  if(["year","dex","gen","qty"].includes(f.t)){
    if(!/^\d+$/.test(v))return{e:`${f.l} must be a whole number`};const n=+v;
    if(f.t=="year"&&(n<1900||n>2100))return{e:"Release year must be 4 digits"};
    if(f.t=="dex"&&(n<1||n>1025))return{e:"Pokédex number must be 1–1025"};
    if(f.t=="gen"&&(n<1||n>9))return{e:"Generation must be 1–9"};
    return{v:n};
  }
  if(f.t=="rate"){const n=Number(v.replace(",","."));return isNaN(n)||n<0||n>10?{e:`${f.l} must be between 0 and 10`}:{v:n}}
  if(f.t=="num"){const n=Number(v.replace(",","."));return isNaN(n)||n<0?{e:`${f.l} must be a number`}:{v:n}}
  return{v};
}
function cnormalize(k,r){

}

function shrink(file,max){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement("canvas");
      cv.width=Math.max(1,Math.round(im.width*s));cv.height=Math.max(1,Math.round(im.height*s));
      const x=cv.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,cv.width,cv.height);x.drawImage(im,0,0,cv.width,cv.height);
      URL.revokeObjectURL(u);res(cv.toDataURL("image/jpeg",.8))};
    im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("That file could not be read as an image"))};im.src=u});
}

function cimp(k){
  const c=CFG[k],d=$("xm");
  d.innerHTML=`<h2 style="margin-top:0">Import ${esc(c.title)} CSV</h2><p class="m">Column names should match: <code>${csvKeys(k).join(", ")}</code> (labels like “${esc(c.fields[0].l)}” also work). Required: ${c.fields.filter(f=>f.req).map(f=>f.k).join(", ")}. ${c.replaceOnImport?"<strong>The file replaces everything currently in this collection.</strong> Pictures are kept for Pops that appear in both.":"Rows that match an existing entry are skipped, so it's safe to import the same file twice."}</p><input type="file" id="xm_f" accept=".csv,text/csv"><div id="xm_r" class="m" role="status" style="margin-top:10px"></div><div class="tg" style="margin-top:12px"><button id="xm_c">Close</button></div>`;
  d.showModal();$("xm_c").onclick=()=>d.close();
  $("xm_f").onchange=e=>{
    const f=e.target.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=async()=>{
      const out=$("xm_r");out.textContent="Importing…";
      const rows=parseCSV(String(rd.result));if(rows.length<2){out.textContent="No rows found.";return}
      const map={};csvFields(k).forEach(f=>{map[f.k]=f.k;map[hnorm(f.l)]=f.k});(c.flags?["owned","wishlist","image_url"]:["image_url"]).forEach(x=>map[x]=x);
      const cols=rows[0].map(h=>map[hnorm(h)]||null);
      const rep=!!c.replaceOnImport,old=CD[k].slice(),oldImg=new Map(old.filter(o=>o.image_url).map(o=>[c.dupe(o),o.image_url])),seen=new Set(rep?[]:CD[k].map(o=>c.dupe(o)));const add=[],errs=[];let skipped=0;
      rows.slice(1).forEach((r,i)=>{
        const o={},es=[];
        cols.forEach((key,j)=>{if(!key)return;const raw=r[j];
          if(key=="owned"||key=="wishlist")o[key]=bl(raw);
          else if(key=="image_url")o[key]=nz(raw);
          else if(key=="status"){const sv=String(raw||"").trim().toLowerCase().replace(/[^a-z]+/g,"_").replace(/^_|_$/g,""),mp={watched:"watched",done:"watched",in_progress:"in_progress",inprogress:"in_progress",watching:"in_progress",tbw:"tbw",to_be_watched:"tbw",to_watch:"tbw",watchlist:"tbw",wishlist:"tbw"};if(!sv)o.status=null;else if(mp[sv])o.status=mp[sv];else es.push("Status \""+raw+"\" is not Watched, In progress or TBW")}
          else{const fd=c.fields.find(f=>f.k==key),x=ccoerce(fd,raw);if(x.e)es.push(x.e);else o[key]=x.v}});
        c.fields.forEach(f=>{if(f.req&&o[f.k]==null)es.push(f.l+" is required")});
        if(es.length){errs.push(`Row ${i+2}: ${es.join("; ")}`);return}
        if(c.flags&&o.owned===undefined)o.owned=true;cnormalize(k,o);
        const key=c.dupe(o);if(seen.has(key)){skipped++;return}seen.add(key);if(rep&&!o.image_url&&oldImg.has(key))o.image_url=oldImg.get(key);add.push(o)});
      if(rep){
        if(!add.length){out.innerHTML=`Nothing was imported, so your existing ${esc(c.title)} were left alone.${errs.length?`<br>${errs.slice(0,10).map(esc).join("<br>")}`:""}`;return}
        if(!confirm(`Replace all ${old.length} existing ${c.title} with the ${add.length} from this file? This can't be undone.`)){out.textContent="Import cancelled. Nothing was changed.";return}
      }
      let ok=0,failed=false;
      for(let i=0;i<add.length;i+=100){
        const{data,error}=await sb.from(c.table).insert(add.slice(i,i+100)).select();
        if(error){errs.push("Save failed: "+error.message);failed=true;break}
        CD[k].push(...data);ok+=data.length;
      }
      let removed=0;
      if(rep&&!failed){
        const ids=old.map(o=>o[c.id]);
        for(let i=0;i<ids.length;i+=100){const{error}=await sb.from(c.table).delete().in(c.id,ids.slice(i,i+100));if(error){errs.push("Could not remove old entries: "+error.message);break}removed+=Math.min(100,ids.length-i)}
        const gone=new Set(old.map(o=>o[c.id]));if(removed>=ids.length)CD[k]=CD[k].filter(o=>!gone.has(o[c.id]));
      }
      out.innerHTML=`<strong>Added ${ok}</strong>${rep?`, replaced ${removed} old entr${removed==1?"y":"ies"}`:`, skipped ${skipped} existing`}${rep&&skipped?`, ${skipped} duplicate row${skipped==1?"":"s"} in the file ignored`:""}, ${errs.length} problem${errs.length==1?"":"s"}.${errs.length?`<br>${errs.slice(0,10).map(esc).join("<br>")}${errs.length>10?"<br>…":""}`:""}`;
      refreshCol();
    };rd.readAsText(f);
  };
}

  if(t.dataset.cd){cdetail(t.dataset.ck,t.dataset.cd);return}
  if(t.dataset.cf){
    const k=t.dataset.ck,c=CFG[k],o=CD[k].find(x=>x[c.id]==t.dataset.cid);if(!o)return;
    const f=t.dataset.cf;let patch;
    if(c.flags){if(f=="wishlist"&&o.owned)return;patch={[f]:!o[f]};if(f=="complete"&&!o.complete){patch.owned=true;patch.wishlist=false}if(f=="owned"&&!o.owned&&o.wishlist)patch.wishlist=false}
    else patch={status:o.status==f?null:f};
    const re=()=>{if($("xd").open)cdetail(k,detId||o[c.id]);refreshCol()};
    const p=cupd(k,o,patch);re();await p;re();return;
  }
});

async function autoPlan(L){
  const P=plOf(L.location_id),nd=L.trip_days||3,cap=Number($("t_cap").value)||TCAP;TCAP=cap;try{localStorage.setItem("tcap",String(cap))}catch(e){}
  const un=P.filter(p=>!p.day&&!p.done&&p.category!="Accommodation");
  if(!un.length){tNote="Nothing to plan: every place is already scheduled or visited.";renderTravel();return}
  const gr={};un.forEach(p=>{(gr[(p.area||"").trim()||"~"]??=[]).push(p)});
  const gl=Object.values(gr);gl.forEach(g=>g.sort((a,b)=>(b.must?1:0)-(a.must?1:0)||String(a.name).localeCompare(b.name)));
  const adds=[];let left=un.length;
  for(let d=1;d<=nd&&left;d++){
    let h=dayItems(L,d).reduce((s,p)=>s+hrs(p),0);
    gl.sort((a,b)=>b.filter(p=>p.must).length-a.filter(p=>p.must).length||b.length-a.length);
    for(const g of gl){
      while(g.length){const p=g[0];if(h>0&&h+hrs(p)>cap)break;adds.push({p,d});h+=hrs(p);g.shift();left--}
    }
  }
  const next={};
  await Promise.all(adds.map(({p,d})=>{const base=dayItems(L,d);next[d]=next[d]??(base.length?Math.max(...base.map(x=>x.day_order||0))+1:0);return pUpd(p,{day:d,day_order:next[d]++})}));
  tNote=`Planned ${adds.length} place${adds.length==1?"":"s"} across ${nd} day${nd==1?"":"s"}, grouping places in the same area and putting must-sees first.`+(left?` ${left} didn't fit: add days or raise the hours per day.`:"");
  renderTravel();
}
function itinText(L){

  }

  return out.join("\n");
}

const CALIAS={"usa":"united states america","us":"united states america","united states":"united states america","america":"united states america",
  "uk":"united kingdom","great britain":"united kingdom","britain":"united kingdom","england":"united kingdom","scotland":"united kingdom","wales":"united kingdom","northern ireland":"united kingdom",

  "congo brazzaville":"congo","republic congo":"congo","congo kinshasa":"democratic republic congo","south korea":"south korea","korea":"south korea","republic korea":"south korea",

const cnorm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/&/g," and ").replace(/\./g," ").replace(/[^a-z0-9 ]+/g," ")
  .split(/\s+/).filter(Boolean).map((w,i,a)=>({dem:"democratic",rep:"republic",herz:"herzegovina",eq:"equatorial",fr:"french",s:"south",n:"north",w:"western",is:i==a.length-1?"islands":"is",cyp:"cyprus"})[w]||w)
  .filter(w=>!["of","the","and"].includes(w)).join(" ");
function matchCountry(txt){
  const n=cnorm(txt);if(!n)return null;const t=CALIAS[n]||n;

  if(n.length>=4){const m=[...WM.names.keys()].filter(k=>k.startsWith(n)||(" "+k+" ").includes(" "+n+" "));if(m.length==1)return WM.names.get(m[0])}

const CITIES={"Austria":"vienna,wien,salzburg,innsbruck,graz,hallstatt","France":"paris,nice,lyon,marseille,bordeaux,cannes,strasbourg,toulouse","England":"london,manchester,liverpool,oxford,cambridge,bath,york,brighton,birmingham,bristol,cornwall","Scotland":"edinburgh,glasgow,aberdeen,inverness,skye","Wales":"cardiff,swansea,snowdonia","Northern Ireland":"belfast,derry,giants causeway","Italy":"rome,roma,milan,venice,florence,naples,pisa,turin,bologna,verona,amalfi,palermo,sicily,sardinia,lake como","Spain":"madrid,barcelona,seville,valencia,granada,malaga,bilbao,ibiza,mallorca,tenerife","Portugal":"lisbon,porto,algarve,madeira","Germany":"berlin,munich,hamburg,cologne,frankfurt,dresden,stuttgart","Netherlands":"amsterdam,rotterdam,the hague,utrecht","Belgium":"brussels,bruges,antwerp,ghent","Switzerland":"zurich,geneva,bern,lucerne,interlaken,zermatt","Czechia":"prague,brno","Hungary":"budapest","Poland":"warsaw,krakow,gdansk","Greece":"athens,santorini,crete,mykonos,thessaloniki,rhodes,corfu","Turkey":"istanbul,ankara,antalya,cappadocia","Ireland":"dublin,galway,cork","Denmark":"copenhagen","Sweden":"stockholm,gothenburg","Norway":"oslo,bergen,tromso","Finland":"helsinki","Iceland":"reykjavik","Malta":"valletta,sliema,mdina,gozo,st julians,mellieha,marsaxlokk","Croatia":"dubrovnik,split,zagreb,hvar","Slovenia":"ljubljana,bled","Slovakia":"bratislava","Romania":"bucharest","Bulgaria":"sofia","Serbia":"belgrade","Bosnia and Herzegovina":"sarajevo,mostar","Estonia":"tallinn","Latvia":"riga","Lithuania":"vilnius","Russia":"moscow,st petersburg","Ukraine":"kyiv,kiev,lviv","USA":"new york,los angeles,san francisco,chicago,miami,las vegas,boston,washington,seattle,orlando,new orleans,san diego,hawaii,nyc","Canada":"toronto,vancouver,montreal,quebec,banff","Mexico":"mexico city,cancun,tulum","Cuba":"havana","Brazil":"rio de janeiro,sao paulo","Argentina":"buenos aires","Peru":"lima,cusco,machu picchu","Chile":"santiago","Colombia":"bogota,cartagena,medellin","Japan":"to const CITY=(()=>{const m={};for(const[c,v]of Object.entries(CITIES))v.split(",").forEach(x=>m[cnorm(x)]=c);return m})();
const NAT={england:"England",scotland:"Scotland",wales:"Wales","northern ireland":"Northern Ireland"};
const natOf=t=>{const n=cnorm(t);return NAT[n]||NAT[cnorm(CITY[n]||"")]||null};
const cityToCountry=t=>{const c=CITY[cnorm(t)];return c?(NAT[cnorm(c)]?matchCountry("United Kingdom"):matchCountry(c)):null};
const cparts=t=>String(t||"").split(/[,;\/|()\u2013]|\s-\s/).map(x=>x.trim()).filter(Boolean).reverse();
// the country a location belongs to: its Country box (also "Vienna, Austria" style text or a city name), else the city in its own name
// the card a location belongs to: like locCountry, but England, Scotland, Wales and Northern Ireland get their own cards
function cardOf(l){
  const c=locCountry(l);if(c&&c!="United Kingdom")return c;
  for(const t of [l.country,...cparts(l.country),l.name,...cparts(l.name)]){const nn=natOf(t);if(nn)return nn}
  return c;
}
const cardOfName=n=>{const t=String(n||"").trim();return natOf(t)||matchCountry(t)||(CITY[cnorm(t)]?cityToCountry(t):null)||t};
function locCountry(l){
  const raw=(l.country||"").trim(),tryAll=t=>matchCountry(t)||cityToCountry(t);
  if(raw){const m=tryAll(raw)||cparts(raw).map(tryAll).find(Boolean);if(m)return m}
  return cityToCountry(l.name)||cparts(l.name).map(tryAll).find(Boolean)||null;
}
function decodeTopo(topo){
  const [sx,sy]=topo.transform?topo.transform.scale:[1,1],[tx,ty]=topo.transform?topo.transform.translate:[0,0];
  const arcs=topo.arcs.map(a=>{let x=0,y=0;return a.map(([dx,dy])=>{x+=dx;y+=dy;return[x*sx+tx,y*sy+ty]})});
  const arc=i=>i<0?arcs[~i].slice().reverse():arcs[i];
  const ring=r=>{const pts=[];r.forEach((i,k)=>{const a=arc(i);pts.push(...(k?a.slice(1):a))});return pts};
  const obj=topo.objects.countries||Object.values(topo.objects)[0];
  return obj.geometries.map(g=>{
    const polys=g.type=="Polygon"?[g.arcs]:g.type=="MultiPolygon"?g.arcs:[];
    return{name:(g.properties&&g.properties.name)||"",rings:polys.flatMap(p=>p.map(ring))};
  });
}
const eqEarth=(lon,lat)=>{
  const A1=1.340264,A2=-0.081106,A3=0.000893,A4=0.003796,l=lon*Math.PI/180,f=lat*Math.PI/180,th=Math.asin(Math.sqrt(3)/2*Math.sin(f)),t2=th*th,t6=t2*t2*t2;

};
function buildMap(topo){
  const cs=decodeTopo(topo).filter(c=>c.name&&c.name!="Antarctica");
  // the source is in spherical coordinates: a ring that crosses the antimeridian jumps from +180 to -180,
  // so unwrap its longitudes and also draw it shifted by 360 degrees (the page clips whatever is outside)
  const X=eqEarth(180,0)[0],Y1=eqEarth(0,84)[1],Y0=eqEarth(0,-58)[1],k=1000/(2*X),H=Math.ceil((Y1-Y0)*k)+2;
  const P=([lo,la])=>{const p=eqEarth(lo,la);return((p[0]+X)*k).toFixed(1)+","+((Y1-p[1])*k+1).toFixed(1)};
  WM.vb=`0 0 1000 ${H}`;WM.W=1000;WM.H=H;WM.names=new Map();
  WM.paths=cs.map(c=>{
    WM.names.set(cnorm(c.name),c.name);
    let d="";
    c.rings.forEach(r=>{
      let off=0,prev=null;const u=r.map(([lo,la])=>{if(prev!==null){if(lo+off-prev>180)off-=360;else if(lo+off-prev<-180)off+=360}const v=lo+off;prev=v;return[v,la]});
      const lons=u.map(q=>q[0]),mn=Math.min(...lons),mx=Math.max(...lons),line=(sh)=>"M"+u.map(([lo,la])=>P([lo+sh,la])).join("L")+"Z";
      if(mn<-180&&mx>180)d+=line(0);else{d+=line(0);if(mx>180)d+=line(-360);if(mn<-180)d+=line(360)}
    });

  });

}
function loadWorld(){
  if(WM.ready||WM.loading)return WM.loading;

  })().then(()=>{WM.loading=null;if(!$("tview").hidden&&!tLoc&&!tCty&&!tWish){drawMap();if($("tres"))fillLocations()}});
  return WM.loading;
}
const MZ={x:0,y:0,w:1000,h:500,z:1};
const mzBox=()=>{if(!MZ.init||MZ.baseH!==WM.H){MZ.x=0;MZ.y=0;MZ.w=WM.W||1000;MZ.h=WM.H||500;MZ.z=1;MZ.init=true;MZ.baseH=WM.H}return`${MZ.x} ${MZ.y} ${MZ.w} ${MZ.h}`};
function mzApply(){
  const svg=document.querySelector("svg.wm");if(!svg)return;
  MZ.x=Math.min(Math.max(0,MZ.x),WM.W-MZ.w);MZ.y=Math.min(Math.max(0,MZ.y),WM.H-MZ.h);
  svg.setAttribute("viewBox",`${MZ.x} ${MZ.y} ${MZ.w} ${MZ.h}`);svg.style.touchAction=MZ.z>1?"none":"pan-y";svg.classList.toggle("zoomed",MZ.z>1);
}
function mzZoom(f,cx,cy){
  const z=Math.min(12,Math.max(1,MZ.z*f));if(z==MZ.z)return;const r=z/MZ.z;
  cx=cx??MZ.x+MZ.w/2;cy=cy??MZ.y+MZ.h/2;
  const nw=WM.W/z,nh=WM.H/z;MZ.x=cx-(cx-MZ.x)*(nw/MZ.w);MZ.y=cy-(cy-MZ.y)*(nh/MZ.h);MZ.w=nw;MZ.h=nh;MZ.z=z;mzApply();
}
const mzPt=(svg,e)=>{const r=svg.getBoundingClientRect();return[MZ.x+(e.clientX-r.left)/r.width*MZ.w,MZ.y+(e.clientY-r.top)/r.height*MZ.h]};
const MP=new Map();let mzDist=0;

const visitedNames=()=>{const s=new Set(),un=new Set();TV.loc.filter(l=>l.status=="visited").forEach(l=>{const m=locCountry(l);if(m)s.add(m);else if(WM.ready||l.country)un.add((l.country||"").trim()?l.country.trim():l.name+" (add its country)")});TV.cty.filter(r=>r.status=="visited").forEach(r=>{const m=matchCountry(r.name)||cityToCountry(r.name);if(m)s.add(m);else if(WM.ready)un.add(r.name)});return{s,un}};
