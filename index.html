<style>
:root{--bg:#faf7f2;--fg:#2a2622;--mut:#7a7168;--card:#fff;--bd:#e4ddd2;--ok:#2f7d4f;--okbg:#e3f3e9;--ac:#8a4b2a;--er:#c0392b;--yw:#FFEE8C;--ywb:#e3cf6a;--gn:#C1E1C1;--gnb:#8dbf8d;--bl:#A7C7E7;--blb:#7fa6cf;--or:#fbdcb8;--orb:#e8b27c;--rd:#f8d4d4;--rdb:#e19a9a;--onc:#2a2622;--onm:#4f5660}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1917;--fg:#eee8df;--mut:#a39a8e;--card:#262321;--bd:#3a3531;--ok:#6fcf97;--okbg:#1f3a2a;--ac:#e0a47e;--er:#ff8a7a;--yw:#756818;--ywb:#b7a53a;--gn:#2d5a3b;--gnb:#5c9a6c;--bl:#2d4c70;--blb:#5886b3;--onc:var(--fg);--onm:#e0d9cc;--or:#4a3319;--orb:#7a5530;--rd:#4a2222;--rdb:#844545}}:root[data-theme=dark]{--bg:#1b1917;--fg:#eee8df;--mut:#a39a8e;--card:#262321;--bd:#3a3531;--ok:#6fcf97;--okbg:#1f3a2a;--ac:#e0a47e;--er:#ff8a7a;--yw:#756818;--ywb:#b7a53a;--gn:#2d5a3b;--gnb:#5c9a6c;--bl:#2d4c70;--blb:#5886b3;--onc:var(--fg);--onm:#e0d9cc;--or:#4a3319;--orb:#7a5530;--rd:#4a2222;--rdb:#844545}:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:15px/1.4 Georgia,'Times New Roman',serif;padding:12px 14px 40px;max-width:900px;margin:auto}
h1{font-size:22px;margin:4px 0 10px}h2{font-size:17px;margin:20px 0 8px;color:var(--ac)}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.top{align-items:center;justify-content:space-between}
input,select,textarea,button{font:inherit;font-size:14px;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;max-width:100%}
input[type=search]{flex:1 1 100%}select{flex:1 1 130px}
button{cursor:pointer}button[aria-pressed=true]{background:var(--okbg);border-color:var(--ok);color:var(--ok)}button[data-f=read][aria-pressed=true]{background:var(--gn);border-color:var(--gnb);color:var(--onc)}button[data-f=safe_mjg][aria-pressed=true]{background:var(--or);border-color:var(--orb);color:var(--fg)}button[data-f=owned][aria-pressed=true]{background:var(--yw);border-color:var(--ywb);color:var(--onc)}button[data-f=wishlist][aria-pressed=true]{background:var(--bl);border-color:var(--blb);color:var(--onc)}button[data-f=tbr][aria-pressed=true]{background:var(--rd);border-color:var(--rdb);color:var(--fg)}
.cnt{color:var(--mut);font-size:13px;margin:4px 0}.err{color:var(--er)}
.row{display:flex;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px}
.cov{flex:0 0 56px;height:84px;border-radius:5px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:9px;padding:3px;color:#fff;overflow:hidden}
.main{flex:1;min-width:0}.t{font-weight:bold;cursor:pointer;background:none;border:0;padding:0;text-align:left;color:var(--fg)}
.m{color:var(--mut);font-size:13px}.tg{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.tg button{padding:3px 9px;font-size:13px}
dialog{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:12px;max-width:520px;width:calc(100% - 24px);max-height:90vh;overflow:auto}
dialog::backdrop{background:#0008}dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:10px 0;font-size:14px}dt{color:var(--mut)}dd{margin:0}
textarea{width:100%;min-height:70px}
.fm label{display:block;font-size:13px;color:var(--mut);margin-top:8px}.fm input:not([type=checkbox]),.fm textarea{width:100%}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row.st-own{background:var(--yw);border-color:var(--ywb)}.row.st-wish{background:var(--bl);border-color:var(--blb)}.row.st-tbr{background:var(--rd);border-color:var(--rdb)}.row.st-mjg{background:var(--or);border-color:var(--orb)}.row.st-done{background:var(--gn);border-color:var(--gnb)}
.cov.has{padding:0}.cov img{width:100%;height:100%;object-fit:cover;border-radius:5px;display:block}
.cov.big{flex:none;width:130px;height:195px;font-size:12px;margin:0 0 10px}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin:10px 0}
.ci{display:flex;flex-direction:column;gap:3px;padding:4px;text-align:left;font-size:11px;color:var(--mut)}
.ci img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:4px;background:var(--bd)}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.gt{display:flex;flex-direction:column;gap:4px;padding:16px 12px;text-align:left;border-radius:12px;border-left:6px solid var(--ac)}
.gt .gn{font-size:16px;font-weight:bold}.bg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.bc{display:flex;flex-direction:column;gap:3px;min-width:0;min-height:128px;padding:6px;background:var(--card);border:1px solid var(--bd);border-radius:8px;font-size:10.5px;line-height:1.25}.bc .bq{font-weight:bold;font-size:10.5px}.bc .m{font-size:10px}.bc .bt{background:none;border:0;padding:0;text-align:left;font-style:italic;font-size:11px;color:inherit;overflow-wrap:anywhere}.bc .bb{display:flex;flex-wrap:wrap;gap:3px;margin-top:auto;justify-content:center}.bc .bb button{box-sizing:border-box;padding:0;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;line-height:1}.bc.bd{background:var(--gn);border-color:var(--gnb);color:var(--onc)}.bc.bd .m{color:var(--onm)}.bc .bb button[data-bnx][aria-pressed=true]{background:var(--bl);border-color:var(--blb);color:var(--onc)}.bc{position:relative;overflow:hidden}.bc>*{position:relative}.bc>.bcv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.28;pointer-events:none}.bc.bu{background:var(--bl);border-color:var(--blb);color:var(--onc)}.bc.bu .m{color:var(--onm)}.bc.bx{border-style:dashed;border-color:var(--ac)}.bc.bx .bq::before{content:'✦ ';color:var(--ac)}.bc .bn{font-style:italic;font-size:11px;overflow-wrap:anywhere}.bc .bb a{padding:1px 5px;font-size:12px;border:1px solid var(--bd);border-radius:4px;color:inherit;text-decoration:none}.bc.bl{box-shadow:inset 0 0 0 2px var(--ac)}@media(max-width:480px){.bc{padding:4px;font-size:9px;min-height:110px}.bc .bq{font-size:9px}.bc .bt{font-size:9.5px}.bc .bb button{width:22px;height:22px;padding:0;font-size:11px}.bc .m{font-size:8.5px}}
.pb{display:block;width:100%;height:8px;border-radius:99px;background:rgba(127,127,127,.28);overflow:hidden;margin-top:8px}.pb.ob{margin-top:8px}.pb.ob+.pb{margin-top:5px}.pb.ob i{background:var(--ywb)}.pb i{display:block;height:100%;background:var(--ok);border-radius:99px}#sbtns .gt{min-height:190px}.gt .sr{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;width:100%;margin-top:auto}.gt .si{display:flex;flex-direction:column;gap:4px}.gt .sr .cov{flex:none;width:56px;height:84px}.gt.own{background:var(--yw);border-top-color:var(--ywb);border-right-color:var(--ywb);border-bottom-color:var(--ywb)}.gt.wish{background:var(--bl);border-top-color:var(--blb);border-right-color:var(--blb);border-bottom-color:var(--blb)}.gt.done{background:var(--gn);border-top-color:var(--gnb);border-right-color:var(--gnb);border-bottom-color:var(--gnb)}.gt.own.wish{background:linear-gradient(to right,var(--yw) 50%,var(--bl) 50%)}.row.st-done,.row.st-done .t,.gt.done,.gt.done .gn,.row.st-own,.row.st-own .t,.gt.own,.gt.own .gn,.row.st-wish,.row.st-wish .t,.gt.wish,.gt.wish .gn{color:var(--onc)}.row.st-done .m,.gt.done .m,.row.st-own .m,.gt.own .m,.row.st-wish .m,.gt.wish .m{color:var(--onm)}.gt.c{border-left-color:var(--tr)}button[data-cf=owned][aria-pressed=true]{background:var(--yw);border-color:var(--ywb);color:var(--onc)}button[data-cf=wishlist][aria-pressed=true]{background:var(--bl);border-color:var(--blb);color:var(--onc)}.cg .ci{align-items:stretch}dialog code{font-size:12px;word-break:break-word}
#login{text-align:center;margin-top:20vh}
</style></head><body>

<div id="login" hidden>
<h1>GFG Collections</h1>
<p class="m">Sign in to see your collections.</p>
<button id="gin">Sign in with Google</button>
<p id="lerr" class="m err" role="alert"></p>

</div>

<div id="app" hidden>
<div class="bar top"><h1 id="ttl">GFG Collections</h1><span><span class="m" id="who"></span> <button id="thm" aria-label="Switch between light and dark mode"></button> <button id="out">Sign out</button></span></div>
<div class="cnt err" id="msg" role="status"></div>

<div id="land" hidden><p class="m" style="margin-top:0">Choose a collection.</p><div class="gg" id="landtiles"></div></div>

<div id="cview" hidden></div>

<div class="bar"><button id="toland">← Collections</button><button id="ad">+ Add book</button><button id="imp">Import CSV</button><button id="ex">Export CSV</button></div>

<script>
// ====== CONFIG: paste your values from Supabase (Project Settings -> API) ======
const SUPABASE_URL = "https://xagqvrmlwqbwlmlljomk.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_nu06QaBn3cq3PVMvxAp8hw_aBQMnC_N";   // anon/publishable key only. NEVER the service_role key.
// ===============================================================================

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const msg=t=>{$("msg").textContent=t||""};
let sb,uid=null,authors=[],genres=[],series=[],books=[],covers=[];
const A=id=>authors.find(x=>x.author_id==id)||{name:"?",sort_name:"?"};
const G=id=>genres.find(x=>x.genre_id==id)||{name:"?"};
const S=id=>series.find(x=>x.series_id==id)||{name:"?"};

/* ---------- auth ---------- */
function showLogin(err){$("app").hidden=true;$("login").hidden=false;if(err){$("lerr").textContent=err}}
async function onSession(s){
  if(!s){uid=null;showLogin();return}
  if(s.user.id===uid)return;
  uid=s.user.id;$("login").hidden=true;$("app").hidden=false;$("who").textContent=s.user.email||"";
  await load();
  loadCols();history.replaceState({v:"land"},"");showLand(false);
}
// Diagnostic line (safe to show: it reveals only the project address and the start of the public key)
try{const h=new URL(SUPABASE_URL);$("diag").textContent=`Check: address=${h.origin}${h.pathname!=="/"?h.pathname:""} · key starts "${SUPABASE_ANON_KEY.slice(0,14)}" (${SUPABASE_ANON_KEY.length} characters) · app v57`}
catch(e){$("diag").textContent=`Check: the Supabase address is not a valid web address (${JSON.stringify(SUPABASE_URL)}) · app v4`}
if(SUPABASE_URL.startsWith("YOUR_")){showLogin("Set SUPABASE_URL and SUPABASE_ANON_KEY at the top of index.html.");$("gin").hidden=true}
else if(!window.supabase){showLogin("Could not load the Supabase library. Check your connection.");$("gin").hidden=true}
else{
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  // do not await Supabase calls inside this callback; defer them
  sb.auth.onAuthStateChange((ev,s)=>{if(["INITIAL_SESSION","SIGNED_IN","SIGNED_OUT"].includes(ev))setTimeout(()=>onSession(s),0)});
}
$("gin").onclick=async()=>{
  // Build the Google sign-in URL ourselves so we can make sure the apikey is attached to it.
  $("lerr").textContent="";
  try{
    const {data,error}=await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname,skipBrowserRedirect:true}});
    if(error||!data?.url){$("lerr").textContent="Could not start sign-in: "+(error?error.message:"no sign-in address returned");return}
    const u=new URL(data.url);
    if(!u.searchParams.has("apikey"))u.searchParams.set("apikey",SUPABASE_ANON_KEY);
    $("lerr").textContent="Going to "+u.origin+u.pathname+" …";
    location.assign(u.toString());
  }catch(e){$("lerr").textContent="Sign-in failed: "+(e&&e.message?e.message:String(e))}
};
$("out").onclick=()=>sb.auth.signOut();

/* ---------- data ---------- */
// Supabase returns at most 1000 rows per request, so read each table in pages of 1000 until it runs out.
async function fetchAll(t,key){
  const out=[];
  for(let from=0;;from+=1000){
    const {data,error}=await sb.from(t).select("*").order(key).range(from,from+999);
    if(error)return{error};
    out.push(...data);
    if(data.length<1000)break;
  }
  return{data:out};
}
async function load(){
  msg("Loading…");
  const keys={authors:"author_id",genres:"genre_id",series:"series_id",books:"book_id",book_covers:"cover_id"};
  const r=await Promise.all(Object.keys(keys).map(t=>fetchAll(t,keys[t])));
  const e=r.find(x=>x.error);if(e){msg("Load failed: "+e.error.message);return}
  [authors,genres,series,books,covers]=r.map(x=>x.data);msg("");fill();render();loadBingo();
  // owned books cannot be on the Wishlist or Safe for MJG lists: tidy up any that already are
  books.filter(b=>b.owned&&(b.wishlist||b.safe_mjg)).forEach(b=>{upd(b,{wishlist:false,safe_mjg:false}).then(render)});
}
async function upd(b,patch){
  const old={};for(const k in patch)old[k]=b[k];Object.assign(b,patch);
  const {error}=await sb.from("books").update(patch).eq("book_id",b.book_id);
  if(error){Object.assign(b,old);msg("Save failed: "+error.message);return false}
  msg("");return true;
}
async function ent(tbl,list,name,mk){
  let x=find(list,name);
  if(!x){const {data,error}=await sb.from(tbl).insert(mk(name.trim())).select().single();if(error)throw error;list.push(data);x=data}
  return x;
}
async function put(d,old){
  const au=await ent("authors",authors,d.author,n=>({name:n,sort_name:sortName(n)}));
  const ge=await ent("genres",genres,d.genre,n=>({name:n}));
  const sn=nz(d.series),se=sn?await ent("series",series,sn,n=>({name:n,author_id:au.author_id,genre_id:ge.genre_id})):null;
  const f={title:d.title.trim(),subtitle:nz(d.subtitle),author_id:au.author_id,series_id:se?se.series_id:null,genre_id:ge.genre_id,
    series_order:num(d.reading_order),reading_order:num(d.reading_order),publication_order:num(d.publication_order),
    publication_year:nz(d.publication_year)?Number(nz(d.publication_year)):null,description:nz(d.description),
    owned:d.owned,read:d.read,...(d.wishlist!==undefined?{wishlist:!!d.wishlist}:{}),...(d.tbr!==undefined?{tbr:!!d.tbr}:{}),notes:"notes" in d?nz(d.notes):old?old.notes:null};
  if(old&&f.owned&&(old.wishlist||old.safe_mjg)){f.wishlist=false;f.safe_mjg=false}
  if(old){const {data,error}=await sb.from("books").update(f).eq("book_id",old.book_id).select().single();if(error)throw error;Object.assign(old,data);return old}
  const sl=slug([ge.name,au.name.split(" ").pop(),sn||"",f.title].filter(Boolean).join(" "));
  let u=sl,i=2;while(books.some(b=>b.slug==u))u=sl+"-"+i++;
  const {data,error}=await sb.from("books").insert({...f,slug:u}).select().single();if(error)throw error;
  books.push(data);return data;
}
async function prune(){
  const sd=series.filter(s=>!books.some(b=>b.series_id==s.series_id)),
        ad=authors.filter(a=>!books.some(b=>b.author_id==a.author_id)),
        gd=genres.filter(g=>!books.some(b=>b.genre_id==g.genre_id));
  for(const [t,k,dead] of [["series","series_id",sd],["authors","author_id",ad],["genres","genre_id",gd]])
    if(dead.length){const {error}=await sb.from(t).delete().in(k,dead.map(x=>x[k]));if(error){msg("Cleanup failed: "+error.message);return}}
  series=series.filter(x=>!sd.includes(x));authors=authors.filter(x=>!ad.includes(x));genres=genres.filter(x=>!gd.includes(x));fill();
}

/* ---------- helpers ---------- */
const sortName=n=>{const p=n.trim().split(/\s+/);return p.length<2?n.trim():p[p.length-1]+", "+p.slice(0,-1).join(" ")};
const slug=s=>s.toLowerCase().replace(/&/g,"and").replace(/['’.]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const find=(l,n)=>l.find(x=>x.name.toLowerCase()==n.trim().toLowerCase());
const num=v=>{if(v==null||String(v).trim()==="")return null;const x=Number(v);return isNaN(x)?NaN:x};
const bl=v=>{const s=String(v??"").trim().toLowerCase();if(!s)return false;if(["true","yes","y","1"].includes(s))return true;if(["false","no","n","0"].includes(s))return false};
const nz=v=>{v=v==null?"":String(v).trim();return v===""?null:v};
function val(d){const e=[];if(!nz(d.title))e.push("title is required");if(!nz(d.author))e.push("author is required");if(!nz(d.genre))e.push("genre is required");
  for(const k of["reading_order","publication_order"])if(isNaN(num(d[k])))e.push(k+" must be numeric");
  if(nz(d.publication_year)&&!/^\d{4}$/.test(nz(d.publication_year)))e.push("publication_year must be a 4-digit year, e.g. 1954");
  if(d.owned===undefined)e.push("owned must be true/false");if(d.read===undefined)e.push("read must be true/false");return e}
function hue(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h}

/* ---------- filters / render ---------- */
function fill(){
  const m={fg:["Genre: any",genres,"genre_id"],fa:["Author: any",authors,"author_id"]};
  for(const id in m){const el=$(id),v=el.value;el.innerHTML=`<option value="">${m[id][0]}</option>`+m[id][1].map(x=>`<option value="${esc(x[m[id][2]])}">${esc(x.name)}</option>`).join("");el.value=v}
  const sv=$("fs").value;$("fs").innerHTML='<option value="">Series: any</option><option value="__s">Standalone only</option>'+series.map(s=>`<option value="${esc(s.series_id)}">${esc(s.name)}</option>`).join("");$("fs").value=sv;
  for(const[id,l]of[["dl_a",authors],["dl_g",genres],["dl_s",series]])$(id).innerHTML=l.map(x=>`<option value="${esc(x.name)}">`).join("");
}
const sorts={reading_order:"Reading order",title:"Title",author:"Author",genre:"Genre",series:"Series",publication_year:"Publication year",owned:"Owned",read:"Read"};
$("so").innerHTML=Object.entries(sorts).map(([k,v])=>`<option value="${k}">Sort: ${v}</option>`).join("");
function key(b,k){switch(k){case"title":return b.title.toLowerCase();case"author":return A(b.author_id).sort_name;case"genre":return G(b.genre_id).name;case"series":return b.series_id?S(b.series_id).name:null;case"owned":case"read":return b[k]?0:1;default:return b[k]}}
function cmp(k){return(a,b)=>{const x=key(a,k),y=key(b,k);if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;return x<y?-1:x>y?1:0}}
const LISTF=["wishlist","safe_mjg"];

        }catch(x){err.push(`Could not remove "${o.title}": ${x.message}`)}

}
function bingoShuffle(i){
  const cells=bingo.cells,c=cells[i],have=new Set(cells.map(x=>x.c));
  const opts=cpool().concat(XDEFS.map(d=>d.id)).filter(id=>!have.has(id));
  if(!opts.length)return;
  c.c=rnd(opts);c.t="";c.a="";c.d=false;c.nx=false;delete c.u;saveBingo();renderBingo();
}

/* ---------- light / dark mode ---------- */
const isDark=()=>{const t=document.documentElement.getAttribute("data-theme");return t?t==="dark":matchMedia("(prefers-color-scheme:dark)").matches};
function themeBtn(){$("thm").textContent=isDark()?"☀ Light mode":"🌙 Dark mode"}
themeBtn();matchMedia("(prefers-color-scheme:dark)").addEventListener&&matchMedia("(prefers-color-scheme:dark)").addEventListener("change",themeBtn);

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.bsh!==undefined){bingoShuffle(+t.dataset.bsh);return}
  if(t.dataset.bnt!==undefined){const c=bingo.cells[+t.dataset.bnt],v=prompt("Book title for this square:",c.t||"");if(v===null)return;const a=prompt("Author:",c.a||"");c.t=v.trim();c.a=a===null?c.a:a.trim();delete c.u;saveBingo();renderBingo();return}
  if(t.dataset.bnx!==undefined){const c=bingo.cells[+t.dataset.bnx];c.nx=!c.nx;saveBingo();renderBingo();return}
  if(t.dataset.bdn!==undefined){const c=bingo.cells[+t.dataset.bdn];c.d=!c.d;saveBingo();renderBingo();return}
  if(t.id=="bnew"){if(confirm("Replace this year's bingo board with a new one? Your progress on this board will be lost.")){bingo.cells=newBoard();saveBingo();renderBingo()}return}
  if(t.id=="thm"){const n=isDark()?"light":"dark";document.documentElement.setAttribute("data-theme",n);try{localStorage.setItem("theme",n)}catch(e){}themeBtn();return}
  if(t.id=="ftog"){filtersHidden=!filtersHidden;try{localStorage.setItem("filtersHidden",filtersHidden?"1":"0")}catch(e){}render();return}
  if(t.dataset.ser!==undefined){go(special?"__"+special:$("fg").value,true,false,t.dataset.ser);return}
  if(t.dataset.genre!==undefined){go(t.dataset.genre,true,true);return}
  if(t.id=="back"){if(history.state&&history.state.v==="list")history.back();else go(null,false);return}
  if(t.dataset.open)return detail(t.dataset.open);
  if(t.dataset.f){
    const b=books.find(x=>x.book_id==t.dataset.id);if(!b)return;
    const refresh=()=>{if($("dlg").open)detail(b.book_id);else render()};
    const f=t.dataset.f;if(b.owned&&LISTF.includes(f))return;
    const patch={[f]:!b[f]};

    if(f=="owned"&&!b.owned){if(b.wishlist)patch.wishlist=false;if(b.safe_mjg)patch.safe_mjg=false}
    const p=upd(b,patch);refresh();await p;refresh();return;
  }
  if(t.id=="gv"){t.setAttribute("aria-pressed",t.getAttribute("aria-pressed")!="true");render()}
  if(t.id=="ad"||t.id=="ad2")form();if(t.id=="imp")imp();if(t.id=="ex")exp();
});

/* ----- detail ----- */
function cdetail(k,id){
  const c=CFG[k],o=CD[k].find(x=>x[c.id]==id);if(!o)return;const d=$("xd");
  const rows=c.fields.filter(f=>f.k!="notes"&&o[f.k]!=null&&o[f.k]!=="").map(f=>`<dt>${esc(f.l.replace(/ \(.*\)$/,""))}</dt><dd>${esc(f.k=="dex_number"?"#"+pad3(o[f.k]):o[f.k])}</dd>`).join("");
  d.innerHTML=`${cimg(k,o,true)}<h2 style="margin-top:0">${esc(o.name)}</h2><div class="m">${esc(c.l1(o))}</div><dl>${rows}</dl>${o.notes?`<p>${esc(o.notes)}</p>`:""}<div class="tg">${ctog(k,o,"owned")}${ctog(k,o,"wishlist")}</div><div class="tg" style="margin-top:12px"><button id="xed">Edit</button><button id="xim">Image</button><button id="xdl">Delete</button><button id="xcl">Close</button></div>`;
  d.showModal();
  $("xcl").onclick=()=>d.close();
  $("xed").onclick=()=>{d.close();cform(k,o)};
  $("xim").onclick=()=>{d.close();cimgDlg(k,o)};
  $("xdl").onclick=async function(){
    if(!this.dataset.c){this.dataset.c=1;this.textContent="Confirm delete?";return}
    const{error}=await sb.from(c.table).delete().eq(c.id,o[c.id]);
    if(error){msg("Delete failed: "+error.message);d.close();return}
    CD[k].splice(CD[k].indexOf(o),1);d.close();refreshCol();
  };
}
/* ----- add / edit form ----- */
function ccoerce(f,v){
  v=String(v??"").trim();if(v==="")return{v:null};
  if(["year","dex","gen","qty"].includes(f.t)){
    if(!/^\d+$/.test(v))return{e:`${f.l} must be a whole number`};const n=+v;
    if(f.t=="year"&&(n<1900||n>2100))return{e:"Release year must be 4 digits"};
    if(f.t=="dex"&&(n<1||n>1025))return{e:"Pokédex number must be 1–1025"};
    if(f.t=="gen"&&(n<1||n>9))return{e:"Generation must be 1–9"};
    return{v:n};
  }
  if(f.t=="num"){const n=Number(v.replace(",","."));return isNaN(n)||n<0?{e:`${f.l} must be a number`}:{v:n}}
  return{v};
}
function cnormalize(k,r){
  if(k=="pokemon"){
    if(r.dex_number&&!r.generation){const g=genOf(r.dex_number);if(g)r.generation=g.n}
    if(r.generation&&!r.region)r.region=GEN[r.generation].r;
    if(r.region){const m=REGIONS.find(x=>x.toLowerCase()==r.region.toLowerCase());if(m)r.region=m}
    if(r.quantity==null)r.quantity=1;
  }
  if(r.owned)r.wishlist=false;
  return r;
}
function cform(k,o,pre){
  const c=CFG[k],d=$("xf"),v=o?{...o}:{...c.defaults(),...(pre||{})};
  const dl=c.fields.map(f=>{
    if(!f.list)return"";
    const vals=Array.isArray(f.list)?f.list:[...new Set(CD[k].map(x=>x[f.k]).filter(Boolean))];
    return`<datalist id="xl_${f.k}">${vals.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>`}).join("");
  const inp=f=>{
    const val=v[f.k]??"";
    if(f.t=="area")return`<label>${f.l}<textarea id="x_${f.k}">${esc(val)}</textarea></label>`;
    if(f.sel)return`<label>${f.l}<select id="x_${f.k}" style="width:100%">${f.sel.map(x=>`<option value="${esc(x)}"${String(x)==String(val)?" selected":""}>${esc(x||"—")}</option>`).join("")}</select></label>`;
    const num=["year","dex","gen","qty"].includes(f.t)?' inputmode="numeric"':f.t=="num"?' inputmode="decimal"':"";
    return`<label>${f.l}<input id="x_${f.k}" value="${esc(val)}"${f.list?` list="xl_${f.k}"`:""}${f.ph?` placeholder="${esc(f.ph)}"`:""}${num}></label>`;
  };
  let h="",i=0;
  while(i<c.fields.length){
    const f=c.fields[i];
    if(f.half&&c.fields[i+1]&&c.fields[i+1].half){h+=`<div class="g2">${inp(f)}${inp(c.fields[i+1])}</div>`;i+=2}
    else{h+=inp(f);i++}
  }
  d.innerHTML=`<h2 style="margin-top:0">${o?"Edit":"Add"} ${esc(c.noun)}</h2>${dl}<div class="fm">${h}<label><input type="checkbox" id="x_owned"${v.owned?" checked":""}> Owned</label><label><input type="checkbox" id="x_wishlist"${v.wishlist?" checked":""}${v.owned?" disabled":""}> On wishlist</label>${k=="pokemon"?'<p class="m" id="xh"></p>':""}</div><p id="xe" class="m err" role="alert"></p><div class="tg"><button type="button" id="xsv">Save</button><button type="button" id="xfc">Cancel</button></div>`;
  d.showModal();
  $("xfc").onclick=()=>d.close();
  $("x_owned").onchange=()=>{const on=$("x_owned").checked;$("x_wishlist").disabled=on;if(on)$("x_wishlist").checked=false};
  if(k=="pokemon"){
    const hint=()=>{const n=parseInt($("x_dex_number").value,10),g=genOf(n);$("xh").textContent=g?`From the Pokédex number: Gen ${g.n} · ${g.r}`:""};
    $("x_dex_number").oninput=hint;hint();
  }
  $("xsv").onclick=async()=>{
    const r={},errs=[];
    c.fields.forEach(f=>{const x=ccoerce(f,$("x_"+f.k).value);if(x.e)errs.push(x.e);else r[f.k]=x.v;if(f.req&&r[f.k]==null&&!x.e)errs.push(f.l+" is required")});
    r.owned=$("x_owned").checked;r.wishlist=!r.owned&&$("x_wishlist").checked;
    if(errs.length){$("xe").textContent=errs.join("; ");return}
    cnormalize(k,r);
    $("xsv").disabled=true;
    try{
      if(o){
        const{data,error}=await sb.from(c.table).update(r).eq(c.id,o[c.id]).select().single();
        if(error)throw error;Object.assign(o,data||r);
      }else{
        const{data,error}=await sb.from(c.table).insert(r).select().single();
        if(error)throw error;CD[k].push(data);
      }
      d.close();refreshCol();
    }catch(err){$("xe").textContent=err.message;$("xsv").disabled=false}
  };
}
/* ----- images: pasted address, uploaded photo, Pokémon TCG search ----- */
function shrink(file,max){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement("canvas");
      cv.width=Math.max(1,Math.round(im.width*s));cv.height=Math.max(1,Math.round(im.height*s));
      const x=cv.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,cv.width,cv.height);x.drawImage(im,0,0,cv.width,cv.height);
      URL.revokeObjectURL(u);res(cv.toDataURL("image/jpeg",.8))};
    im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("That file could not be read as an image"))};im.src=u});
}
function cimgDlg(k,o){
  const c=CFG[k],d=$("xi"),pk=k=="pokemon";
  let found=[];
  d.innerHTML=`<h2 style="margin-top:0">Image — ${esc(o.name)}</h2><div id="xipv">${cimg(k,o,true)}</div>
  <div class="fm"><label>Paste an image address<input id="xi_u" placeholder="https://…"></label></div><div class="tg"><button id="xi_use">Use address</button></div>
  <div class="fm"><label>Or upload a photo<input type="file" id="xi_f" accept="image/*"></label></div>
  ${pk?`<div class="fm"><label>Search the Pokémon TCG database<input id="xi_q" value="${esc(o.name)}"></label></div><div class="tg"><button id="xi_s">Search cards</button>${o.dex_number?'<button id="xi_art">Use official artwork</button>':""}</div>`
      :`<p class="m" style="margin-top:10px"><a target="_blank" rel="noopener" href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent("Funko Pop "+[o.series,o.name,o.number?"#"+o.number:""].filter(Boolean).join(" "))}">Search the web for this Pop ↗</a> — then copy the image address and paste it above.</p>`}
  <div class="cg" id="xi_r"></div><p class="m" id="xi_n" role="status"></p>
  <div class="tg"><button id="xi_rm">Remove image</button><button id="xi_x">Close</button></div>`;
  d.showModal();
  const say=t=>$("xi_n").textContent=t||"";
  const save=async(patch)=>{
    const ok=await cupd(k,o,patch);
    if(ok){$("xipv").innerHTML=cimg(k,o,true);say("Image saved.");refreshCol()}else say("Could not save the image.");
  };
  $("xi_x").onclick=()=>d.close();
  $("xi_use").onclick=()=>{const u=$("xi_u").value.trim();if(!/^https:\/\/\S+$/i.test(u)){say("Enter an address starting with https://");return}save({image_url:u})};
  $("xi_rm").onclick=()=>save({image_url:null});
  $("xi_f").onchange=async e=>{const f=e.target.files[0];if(!f)return;say("Preparing photo…");try{save({image_url:await shrink(f,420)})}catch(err){say(err.message)}};
  if(pk){
    if($("xi_art"))$("xi_art").onclick=()=>save({image_url:`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${o.dex_number}.png`});
    const search=async()=>{
      const name=$("xi_q").value.replace(/["\\]/g,"").trim();if(!name){say("Enter a name to search for.");return}
      const parts=[`name:"${name}"`],n=String(o.card_number||"").split("/")[0].replace(/^0+/,"");
      if(n&&/^[A-Za-z0-9-]+$/.test(n))parts.push("number:"+n);
      say("Searching…");$("xi_r").innerHTML="";
      try{
        const r=await fetch("https://api.pokemontcg.io/v2/cards?pageSize=24&orderBy=-set.releaseDate&q="+encodeURIComponent(parts.join(" ")));
        if(!r.ok)throw new Error("The card database answered "+r.status);
        found=(await r.json()).data||[];
        if(!found.length){say(n?"No matches. Try clearing the card number on this item, or a shorter name.":"No matches. Try a shorter name.");return}
        say("Tap a card to use its image. Blank details (artist, rarity, set, number) are filled in too.");
        $("xi_r").innerHTML=found.map((x,i)=>`<button class="ci" data-xr="${i}"><img src="${esc(x.images&&x.images.small||"")}" alt="${esc(x.name)}" loading="lazy" referrerpolicy="no-referrer"><span>${esc((x.set&&x.set.name||"")+" "+(x.number||""))}</span></button>`).join("");
      }catch(err){say("Search failed: "+err.message+". You can still paste an address or upload a photo.")}
    };
    $("xi_s").onclick=search;$("xi_q").onkeydown=e=>{if(e.key=="Enter")search()};
    $("xi_r").onclick=e=>{
      const b=e.target.closest("[data-xr]");if(!b)return;const x=found[+b.dataset.xr];if(!x)return;
      const p={image_url:x.images&&(x.images.large||x.images.small)||null};
      if(!o.artist&&x.artist)p.artist=x.artist;
      if(!o.rarity&&x.rarity)p.rarity=x.rarity;
      if(!o.set_name&&x.set&&x.set.name)p.set_name=x.set.name;
      if(!o.card_number&&x.number)p.card_number=x.set&&x.set.printedTotal?`${x.number}/${x.set.printedTotal}`:x.number;
      if(!o.release_year&&x.set&&x.set.releaseDate)p.release_year=+String(x.set.releaseDate).slice(0,4)||null;
      if(!o.energy_type&&x.types&&x.types[0])p.energy_type=x.types[0];
      if(!o.dex_number&&x.nationalPokedexNumbers&&x.nationalPokedexNumbers[0]){p.dex_number=x.nationalPokedexNumbers[0];const g=genOf(p.dex_number);if(g&&!o.generation){p.generation=g.n;if(!o.region)p.region=g.r}}
      if(x.supertype&&["Trainer","Energy"].includes(x.supertype))p.card_type=x.supertype;
      save(p);
    };
  }
}
/* ----- CSV ----- */
const csvFields=k=>CFG[k].fields.filter(f=>!(CFG[k].csvOff||[]).includes(f.k));
const csvKeys=k=>csvFields(k).map(f=>f.k).concat(["owned","wishlist","image_url"]);
const hnorm=s=>String(s||"").replace(/^\ufeff/,"").toLowerCase().replace(/\(.*?\)/g,"").replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"");
function cexp(k){
  const c=CFG[k],q=v=>{v=v==null?"":String(v);return/[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const H=csvKeys(k),rows=CD[k].map(o=>H.map(h=>q(o[h])).join(","));
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+[H.join(","),...rows].join("\r\n")],{type:"text/csv"}));
  a.download=c.table.replace("_","-")+".csv";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function cimp(k){
  const c=CFG[k],d=$("xm");
  d.innerHTML=`<h2 style="margin-top:0">Import ${esc(c.title)} CSV</h2><p class="m">Column names should match: <code>${csvKeys(k).join(", ")}</code> (labels like “${esc(c.fields[0].l)}” also work). Required: ${c.fields.filter(f=>f.req).map(f=>f.k).join(", ")}. Rows that match an existing entry are skipped, so it's safe to import the same file twice.</p><input type="file" id="xm_f" accept=".csv,text/csv"><div id="xm_r" class="m" role="status" style="margin-top:10px"></div><div class="tg" style="margin-top:12px"><button id="xm_c">Close</button></div>`;
  d.showModal();$("xm_c").onclick=()=>d.close();
  $("xm_f").onchange=e=>{
    const f=e.target.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=async()=>{
      const out=$("xm_r");out.textContent="Importing…";
      const rows=parseCSV(String(rd.result));if(rows.length<2){out.textContent="No rows found.";return}
      const map={};csvFields(k).forEach(f=>{map[f.k]=f.k;map[hnorm(f.l)]=f.k});["owned","wishlist","image_url"].forEach(x=>map[x]=x);
      const cols=rows[0].map(h=>map[hnorm(h)]||null);
      const seen=new Set(CD[k].map(o=>c.dupe(o)));const add=[],errs=[];let skipped=0;
      rows.slice(1).forEach((r,i)=>{
        const o={},es=[];
        cols.forEach((key,j)=>{if(!key)return;const raw=r[j];
          if(key=="owned"||key=="wishlist")o[key]=bl(raw);
          else if(key=="image_url")o[key]=nz(raw);
          else{const fd=c.fields.find(f=>f.k==key),x=ccoerce(fd,raw);if(x.e)es.push(x.e);else o[key]=x.v}});
        c.fields.forEach(f=>{if(f.req&&o[f.k]==null)es.push(f.l+" is required")});
        if(es.length){errs.push(`Row ${i+2}: ${es.join("; ")}`);return}
        if(o.owned===undefined)o.owned=true;cnormalize(k,o);
        const key=c.dupe(o);if(seen.has(key)){skipped++;return}seen.add(key);add.push(o)});
      let ok=0;
      for(let i=0;i<add.length;i+=100){
        const{data,error}=await sb.from(c.table).insert(add.slice(i,i+100)).select();
        if(error){errs.push("Save failed: "+error.message);break}
        CD[k].push(...data);ok+=data.length;
      }
      out.innerHTML=`<strong>Added ${ok}</strong>, skipped ${skipped} existing, ${errs.length} problem${errs.length==1?"":"s"}.${errs.length?`<br>${errs.slice(0,10).map(esc).join("<br>")}${errs.length>10?"<br>…":""}`:""}`;
      refreshCol();
    };rd.readAsText(f);
  };
}
/* ----- events ----- */
document.addEventListener("error",e=>{const t=e.target;if(t&&t.tagName==="IMG"&&t.classList.contains("cix")){const p=t.parentElement;p.classList.remove("has");p.textContent="[Image unavailable]"}},true);
document.addEventListener("click",async e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.id=="toland"){showLand(true);return}
  if(t.dataset.land){const k=t.dataset.land;if(k=="books")go(null,true);else colGo(k,null,true);return}
  if(t.dataset.cg!==undefined){colGo(curK,t.dataset.cg,true);return}
  if(t.dataset.cn){
    const n=t.dataset.cn;
    if(n=="land")showLand(true);
    else if(n=="home"){if(history.state&&history.state.v==="c"&&history.state.grp!=null)history.back();else colGo(curK,null,false)}
    else if(n=="add"){const c=CFG[curK],pre={};
      if(curGrp&&curGrp!="__all"&&curGrp!="__wishlist"){
        if(curK=="funko")pre.series=scopeName(curK,curGrp);
        else if(curGrp!="other"){const[g,r]=curGrp.split("|");pre.generation=+g;pre.region=r}else pre.card_type="Trainer"}
      if(curGrp=="__wishlist"){pre.owned=false;pre.wishlist=true}
      cform(curK,null,pre)}
    else if(n=="imp")cimp(curK);else if(n=="exp")cexp(curK);
    return;
  }
  if(t.dataset.cd){cdetail(t.dataset.ck,t.dataset.cd);return}
  if(t.dataset.cf){
    const k=t.dataset.ck,c=CFG[k],o=CD[k].find(x=>x[c.id]==t.dataset.cid);if(!o)return;
    const f=t.dataset.cf;if(f=="wishlist"&&o.owned)return;
    const patch={[f]:!o[f]};if(f=="owned"&&!o.owned&&o.wishlist)patch.wishlist=false;
    const re=()=>{if($("xd").open)cdetail(k,o[c.id]);refreshCol()};
    const p=cupd(k,o,patch);re();await p;re();return;
  }
});
document.addEventListener("input",e=>{
  const t=e.target;if(!t.id||$("cview").hidden||!curK)return;const s=CS[curK];
  if(t.id=="cq")s.q=t.value;else if(t.id=="cf1")s.f1=t.value;else if(t.id=="cf2")s.f2=t.value;else if(t.id=="co")s.o=t.value;else if(t.id=="cso")s.so=t.value;else return;
  fillColList();
});
</script>
